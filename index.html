<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Workspace - Gemini Code Analyzer</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CodeMirror CSS & Theme (Monokai) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP NAVIGATION BAR -->
  <header class="topbar">
    <div class="nav-left">
      <div class="logo-icon"><i class="fas fa-file-code"></i></div>
      <div class="file-info">
        <div class="file-name">main.py</div>
        <div class="file-status">Connected to Gemini AI Server</div>
      </div>
    </div>
    <div class="nav-right">
      <button id="analyze-btn" class="run-btn">
        <i class="fas fa-play"></i> <span>Run Code</span>
      </button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main class="workspace">
    
    <!-- CODE CELL -->
    <section class="cell code-cell">
      <div class="cell-header">
        <div class="cell-title"><i class="fab fa-python"></i> Python Engine</div>
        <div class="cell-meta" id="char-count">0 chars</div>
      </div>
      <div class="editor-container">
        <textarea id="code-editor">
def calculate_average(numbers):
    total = 0
    # BUG: missing colon
    for num in numbers
        total += num
    return total / len(numbers)

scores = [85, 92, 78]
print(calculate_average(scores))</textarea>
      </div>
    </section>

    <!-- OUTPUT CELL -->
    <section class="cell output-cell">
      <div class="cell-header">
        <div class="cell-title"><i class="fas fa-terminal"></i> Terminal Output</div>
        <div class="cell-meta" id="resp-time">Ready</div>
      </div>
      
      <div id="output-content" class="output-container">
        <div class="placeholder-text" id="placeholder">
          <i class="fas fa-info-circle"></i> Click <strong>Run Code</strong> to execute and analyze.
        </div>
        <div class="loader" id="loader" style="display: none;">
          <i class="fas fa-circle-notch fa-spin"></i> Analyzing with Gemini AI...
        </div>
        <div class="result-section" id="result-section" style="display: none;"></div>
      </div>
    </section>
    
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
